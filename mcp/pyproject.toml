[project]
name = "codenodes-mcp"
version = "0.1.0"
description = "MCP server for CodeNodes: write GPU code, get real Blender geometry, look at the result"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2"]

[project.scripts]
codenodes-mcp = "codenodes_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codenodes_mcp"]
