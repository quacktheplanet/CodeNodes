<title>Rampart Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --paper: #F2F4EF; --panel: rgba(242, 244, 239, 0.94); --ink: #1D2822; --muted: #5E6B63;
  --line: #D3DAD1; --accent: #2E6A9E; --accent-ink: #FFFFFF; --hover: #E3E9E2; --danger: #A5392B;
  --display: "Barlow Semi Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131916; --panel: rgba(19, 25, 22, 0.92); --ink: #E4EBE6; --muted: #98A69D;
    --line: #2B3530; --accent: #86B6DF; --accent-ink: #0E1A24; --hover: #1F2824; --danger: #E08A7C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131916; --panel: rgba(19, 25, 22, 0.92); --ink: #E4EBE6; --muted: #98A69D;
  --line: #2B3530; --accent: #86B6DF; --accent-ink: #0E1A24; --hover: #1F2824; --danger: #E08A7C;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--display); overflow: hidden; font-size: 15px; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.bar { position: fixed; display: flex; gap: 8px; align-items: center; background: var(--panel);
  backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 10px; }
#top { top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; padding: 8px 12px; flex-wrap: wrap; }
#top h1 { margin: 0 8px 0 0; font-size: 22px; font-weight: 700; letter-spacing: 0.01em; }
#top .spacer { flex: 1; }
#tools { top: 76px; left: 12px; flex-direction: column; padding: 6px; gap: 4px; }
button, select { font: inherit; color: var(--ink); }
.tool { width: 132px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  background: none; border: 1px solid transparent; border-radius: 7px; padding: 6px 9px; cursor: pointer;
  font-weight: 600; letter-spacing: 0.02em; text-align: left; }
.tool kbd { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.tool:hover { background: var(--hover); }
.tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tool[aria-pressed="true"] kbd { color: var(--accent-ink); border-color: transparent; }
.btn { background: none; border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; font-weight: 600; }
.btn:hover { background: var(--hover); }
.btn.danger { color: var(--danger); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#props { top: 76px; right: 12px; width: min(270px, calc(100% - 180px)); flex-direction: column; align-items: stretch;
  padding: 12px 14px; gap: 12px; max-height: calc(100% - 150px); overflow: auto; }
#props h2 { margin: 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
#props .name { font-size: 20px; font-weight: 700; margin-top: -6px; }
.field { display: grid; gap: 4px; }
.field .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.field label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
.field output { font-family: var(--mono); font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
.field input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
.field select { width: 100%; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
.check { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.note { font-size: 13px; color: var(--muted); line-height: 1.4; margin: 0; }
.stats { font-family: var(--mono); font-size: 12px; color: var(--muted); display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
#hint { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  padding: 7px 14px; font-size: 14px; max-width: calc(100% - 24px); }
#hint b { font-weight: 700; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); width: min(560px, calc(100% - 32px)); padding: 16px; }
dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
dialog h2 { margin: 0 0 6px; font-size: 20px; }
dialog textarea { width: 100%; box-sizing: border-box; height: 240px; font-family: var(--mono); font-size: 12px;
  background: var(--hover); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
dialog .actions { margin-top: 10px; justify-content: flex-end; }
#status { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.timebox { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.timebox input { width: 130px; accent-color: var(--accent); }
.timebox output { font-family: var(--mono); font-size: 13px; color: var(--accent); width: 3.2em; }
#quality { padding: 5px 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); font-weight: 600; }
#props h3 { margin: 4px 0 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; border-top: 1px solid var(--line); padding-top: 10px; }
@media (max-width: 720px) {
  #tools { top: auto; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); left: 8px; right: 8px; flex-direction: row; overflow-x: auto; }
  .tool { width: auto; flex: 0 0 auto; }
  .tool kbd { display: none; }
  #props { top: 64px; right: 8px; width: calc(100% - 16px); max-height: 38%; }
  #top h1 { font-size: 18px; }
  #hint { font-size: 12px; }
}
</style>

<div id="stage"></div>
<header id="top" class="bar">
  <h1>Rampart</h1>
  <button class="btn" id="undo" type="button" title="Undo (Ctrl+Z)">Undo</button>
  <button class="btn" id="redo" type="button" title="Redo (Ctrl+Y)">Redo</button>

  <span class="timebox"><label for="time">Time</label><input type="range" id="time" min="5" max="23.5" step="0.25" value="15.5"><output id="timeOut" for="time">15:30</output></span>
  <select id="quality" aria-label="Graphics quality" title="Graphics quality">
    <option value="low">Low</option><option value="high" selected>High</option><option value="ultra">Ultra</option>

<nav id="tools" class="bar" aria-label="Tools">
  <button class="tool" type="button" data-tool="select" aria-pressed="true">Select <kbd>V</kbd></button>

  <button class="tool" type="button" data-tool="door" aria-pressed="false">Doorway <kbd>D</kbd></button>
  <button class="tool" type="button" data-tool="bridge" aria-pressed="false">Bridge <kbd>B</kbd></button>
  <button class="tool" type="button" data-tool="light" aria-pressed="false">Lamp <kbd>L</kbd></button>

  <button class="tool" type="button" data-tool="tree" aria-pressed="false">Tree <kbd>E</kbd></button>

  <textarea id="layoutText" spellcheck="false" aria-label="Layout JSON"></textarea>
  <div class="actions">
    <button class="btn" type="button" id="copyLayout">Copy</button>
    <button class="btn" type="button" id="loadLayout">Load pasted layout</button>
    <button class="btn danger" type="button" id="resetLayout">Start from the sample</button>
    <button class="btn" type="button" id="closeLayout">Close</button>
  </div>
  <p class="note" id="layoutMsg"></p>
</dialog>

<script>
window.addEventListener("error", function (e) { var s = document.getElementById("status"); if (s) s.textContent = "Error: " + e.message; });
</script>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/SAOShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/DepthLimitedBlurShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/UnpackDepthRGBAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/Pass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/SAOPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/objects/Sky.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/objects/Water.js"></script>
<script>
(function () {
"use strict";
const statusEl = document.getElementById("status");
if (!window.THREE || !THREE.OrbitControls) { statusEl.textContent = "Could not load three.js from cdn.jsdelivr.net."; return; }
const missing = ["BufferGeometryUtils", "EffectComposer", "RenderPass", "ShaderPass", "UnrealBloomPass", "SAOPass", "Sky", "Water", "FXAAShader"]
  .filter((k) => !THREE[k]);
if (missing.length) statusEl.textContent = "Some effects did not load (" + missing.join(", ") + "); running without them.";
const HAS = (k) => !!THREE[k];
THREE.ColorManagement.legacyMode = false;

// ---------------------------------------------------------------- textures, made here
// Everything is generated in the page: a tileable masonry map with bump detail, wood,
// ground grain and water ripples. Each covers 2 m, and geometry is mapped in metres.
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function tileNoise(n, cells, seed) {
  const r = rng(seed), grid = new Float32Array(cells * cells).map(() => r()), out = new Float32Array(n * n);
  const sm = (t) => t * t * (3 - 2 * t);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const gx = x / n * cells, gy = y / n * cells, x0 = Math.floor(gx), y0 = Math.floor(gy), fx = sm(gx - x0), fy = sm(gy - y0);
    const g = (i, j) => grid[((j % cells) * cells) + (i % cells)];
    const a = g(x0, y0) + (g(x0 + 1, y0) - g(x0, y0)) * fx, b = g(x0, y0 + 1) + (g(x0 + 1, y0 + 1) - g(x0, y0 + 1)) * fx;
    out[y * n + x] = a + (b - a) * fy;
  }
  return out;
}
function fbm(n, seed, octaves) {
  const out = new Float32Array(n * n); let amp = 0.5, total = 0;
  for (let o = 0; o < octaves; o++) { const t = tileNoise(n, 4 << o, seed + o * 17); for (let i = 0; i < out.length; i++) out[i] += t[i] * amp; total += amp; amp *= 0.5; }
  for (let i = 0; i < out.length; i++) out[i] /= total;
  return out;
}
function toTexture(n, fill, srgb) {
  const c = document.createElement("canvas"); c.width = c.height = n;
  const ctx = c.getContext("2d"), img = ctx.createImageData(n, n);
  for (let i = 0; i < n * n; i++) { const [r, g, b] = fill(i); img.data[i * 4] = r; img.data[i * 4 + 1] = g; img.data[i * 4 + 2] = b; img.data[i * 4 + 3] = 255; }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  if (srgb) t.encoding = THREE.sRGBEncoding;
  return t;
}
function normalsFrom(n, height, strength) {
  return toTexture(n, (i) => {
    const x = i % n, y = (i / n) | 0, h = (xx, yy) => height[((yy + n) % n) * n + ((xx + n) % n)];
    const dx = (h(x + 1, y) - h(x - 1, y)) * strength, dy = (h(x, y + 1) - h(x, y - 1)) * strength;
    const l = Math.hypot(dx, dy, 1);
    return [(-dx / l * 0.5 + 0.5) * 255, (dy / l * 0.5 + 0.5) * 255, (1 / l * 0.5 + 0.5) * 255];
  }, false);
}
function masonry() {
  const n = 512, perM = n / 2, rowH = 0.25 * perM, r = rng(7), grain = fbm(n, 3, 5);
  const h = new Float32Array(n * n), tone = new Float32Array(n * n).fill(0.55);
  for (let row = 0; row < n / rowH; row++) {
    const y0 = Math.round(row * rowH), y1 = Math.round((row + 1) * rowH);
    let x = Math.floor(r() * n), covered = 0;
    while (covered < n) {
      const len = Math.round((0.4 + r() * 0.45) * perM), shade = 0.78 + r() * 0.3;
      for (let yy = y0 + 2; yy < y1 - 2; yy++) for (let k = 2; k < len - 2; k++) {
        const xx = (x + k) % n, i = yy * n + xx;
        const edge = Math.min(k - 2, len - 3 - k, yy - y0 - 2, y1 - 3 - yy);
        h[i] = Math.min(1, edge / 5) * (0.8 + 0.2 * grain[i]);
        tone[i] = shade * (0.88 + 0.24 * grain[i]);
      }
      x += len; covered += len;
    }
  }
  return {
    map: toTexture(n, (i) => { const v = tone[i] * 255; return [v, v * 0.97, v * 0.92]; }, true),
    normal: normalsFrom(n, h, 2.2),
  };
}
function woodgrain() {
  const n = 256, g = fbm(n, 11, 4), h = new Float32Array(n * n), tone = new Float32Array(n * n);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const i = y * n + x, plank = Math.floor(y / 32), within = (y % 32) / 32;
    const lines = 0.5 + 0.5 * Math.sin((x / n) * Math.PI * 2 * 3 + g[i] * 9 + plank * 1.7);
    tone[i] = (0.75 + 0.25 * lines) * (0.9 + 0.1 * ((plank * 37) % 5) / 4);
    h[i] = within < 0.06 || within > 0.94 ? 0 : 0.6 + 0.4 * lines;
  }
  return { map: toTexture(n, (i) => { const v = tone[i] * 255; return [v, v * 0.93, v * 0.85]; }, true), normal: normalsFrom(n, h, 1.6) };
}
function groundGrain() { const n = 256, g = fbm(n, 21, 6); return toTexture(n, (i) => { const v = (0.82 + 0.3 * g[i]) * 255; return [v, v, v * 0.96]; }, true); }
function ripples() {
  const n = 256, h = new Float32Array(n * n);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const u = x / n * Math.PI * 2, v = y / n * Math.PI * 2;
    h[y * n + x] = Math.sin(u * 3 + v * 2) + 0.6 * Math.sin(u * 7 - v * 5 + 1) + 0.35 * Math.sin(u * 13 + v * 11 + 2) + 0.2 * Math.sin(u * 23 - v * 19);
  }
  return normalsFrom(n, h, 0.9);
}
const TEX = { stone: masonry(), wood: woodgrain(), grain: groundGrain(), water: ripples() };

// ---------------------------------------------------------------- the ground and its river
const GROUND_SIZE = 90, WATER_Y = -0.95;
function riverCentre(x) { return 7 + Math.sin(x * 0.07) * 3 + Math.sin(x * 0.023 + 1) * 4; }
function groundY(x, z) {
  const d = Math.abs(z - riverCentre(x)) / 5.2;
  const trench = Math.exp(-Math.pow(d, 4));
  const hills = 0.35 * Math.sin(x * 0.13) * Math.cos(z * 0.11) + 0.22 * Math.sin(x * 0.05 + z * 0.07);
  return hills * (1 - trench) - 2.0 * trench;
}

// ---------------------------------------------------------------- the level, as data
const SAMPLE = {
  version: 1,
  walls: [
    { id: "w1", points: [[-12, -18], [4, -18], [4, -6], [-12, -6]], closed: true, height: 3.4, thickness: 0.6,
      posts: true, battlements: true,
      openings: [{ id: "o1", s: 8, width: 2.2, height: 2.8, style: "archdoor" },
                 { id: "o2", s: 22, width: 1.6, height: 2.4, style: "door" },
                 { id: "o3", s: 35, width: 2.4, height: 2.9, style: "gate" }] },
    { id: "w2", points: [[10, -16], [22, -12], [26, -3]], closed: false, height: 2.4, thickness: 0.45,
      posts: false, battlements: false,
      openings: [{ id: "o4", s: 6, width: 1.4, height: 2.0, style: "opening" }] }
  ],
  bridges: [{ id: "b1", a: [-2, 0], b: [0, 15], width: 2.6, lift: 0.3, rails: true }],
  lights: [{ id: "l1", p: [-3.5, -3], color: "warm", power: 1 }, { id: "l2", p: [2, -3], color: "warm", power: 1 },
           { id: "l3", p: [-1.8, 17], color: "warm", power: 1 }, { id: "l4", p: [2.2, 17], color: "warm", power: 1 },
           { id: "l5", p: [-4, -12], color: "cool", power: 1 }],
  features: [{ id: "f1", kind: "tower", p: [-12, -18], rot: 0, scale: 1 }, { id: "f2", kind: "tower", p: [4, -6], rot: 0, scale: 0.8 },
             { id: "f3", kind: "tree", p: [12, 22], rot: 0, scale: 1.2 }, { id: "f4", kind: "tree", p: [16, 19], rot: 1, scale: 0.9 },
             { id: "f5", kind: "tree", p: [-16, 24], rot: 2, scale: 1.1 }, { id: "f6", kind: "tree", p: [-20, 18], rot: 0, scale: 0.8 },
             { id: "f7", kind: "tree", p: [18, -24], rot: 0, scale: 1 }, { id: "f8", kind: "crate", p: [-8, -9], rot: 0.4, scale: 1 },
             { id: "f9", kind: "crate", p: [-7, -8.2], rot: 0.1, scale: 0.8 }]
};
const STYLES = { opening: "Opening", door: "Door", double: "Double door", arch: "Arch", archdoor: "Arch with door", gate: "Portcullis" };
const clone = (o) => JSON.parse(JSON.stringify(o));
let S = load() || clone(SAMPLE);
let uid = 100;
function nid(p) { uid += 1; return p + uid + Math.random().toString(36).slice(2, 5); }
function load() {
  try { const t = localStorage.getItem("rampart-layout"); if (t) { const s = JSON.parse(t); if (s && s.walls) return s; } } catch (e) {}
  return null;
}
function save() { try { localStorage.setItem("rampart-layout", JSON.stringify(S)); } catch (e) {} }

// history: a snapshot before each change
const past = [], future = [];
function remember() { past.push(JSON.stringify(S)); if (past.length > 100) past.shift(); future.length = 0; }
function undo() { if (!past.length) return; future.push(JSON.stringify(S)); S = JSON.parse(past.pop()); afterJump(); }
function redo() { if (!future.length) return; past.push(JSON.stringify(S)); S = JSON.parse(future.pop()); afterJump(); }
function afterJump() { if (selected && !findThing(selected)) selected = null; rebuildAll(); save(); showProps(); }

// ---------------------------------------------------------------- three.js
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// The scene renders to a floating-point target and the last pass does tone mapping and
// sRGB itself, so bloom and the sun's glare see real brightness rather than clipped white.
renderer.outputEncoding = THREE.LinearEncoding;
renderer.toneMapping = THREE.NoToneMapping;
renderer.physicallyCorrectLights = true;
renderer.info.autoReset = false;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);
camera.position.set(-30, 32, 34);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(-2, 0, -4);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 6; controls.maxDistance = 140;
controls.update();

const hemi = new THREE.HemisphereLight(0xcfe0f2, 0x4a4436, 1.2);
const sun = new THREE.DirectionalLight(0xfff1dc, 3.2);
sun.position.set(-30, 40, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -50, right: 50, top: 50, bottom: -50, near: 1, far: 140 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.04;
scene.add(hemi, sun);

// a physical sky, which also lights the scene through a filtered environment map
const sky = HAS("Sky") ? new THREE.Sky() : null;
const pmrem = new THREE.PMREMGenerator(renderer);
const skyScene = new THREE.Scene();

// Texture coordinates in metres of the frame the box sits in: masonry runs on unbroken
// from one block of wall to the next, round openings, and never stretches.

function buildOpening(g, w, o, u, gy, top) {

    const hole = new THREE.Path(); hole.moveTo(half, 0); hole.absarc(0, 0, half, 0, Math.PI, false); hole.lineTo(half, 0);

function buildWall(w) {

function buildFeature(f) {

    add(new THREE.CylinderGeometry(0.16, 0.24, 2.2, 7), M.bark, 1.1);
    add(new THREE.ConeGeometry(1.7, 2.8, 8), M.leaves, 2.8);
    add(new THREE.ConeGeometry(1.25, 2.3, 8), M.leaves, 3.9);
    add(new THREE.ConeGeometry(0.8, 1.8, 8), M.leaves, 4.9);

    add(new THREE.BoxGeometry(1.04, 0.1, 1.04), M.darkwood, 0.92);

}

// ---------------------------------------------------------------- day and night
let night = false, hour = 15.5, lampLevel = 0;
function placeNightLights() {
  nightLights.forEach((l) => scene.remove(l)); nightLights.length = 0;
  if (lampLevel < 0.02) return;
  S.lights.slice(0, 24).forEach((l) => {
    const pl = new THREE.PointLight(l.color === "cool" ? 0xbfe0ff : 0xffb86a, 70 * (l.power || 1) * lampLevel, 18, 2);
    pl.position.set(l.p[0], groundY(l.p[0], l.p[1]) + 3.2, l.p[1]);
    scene.add(pl); nightLights.push(pl);

}

// ---------------------------------------------------------------- the time of day
// The sun rises at 6:00 and sets at 19:00. Its colour warms near the horizon, the sky
// shader does the sunset, and once it is down a pale moon takes over and the lamps come on.
const sunDir = new THREE.Vector3();
function sunAt(h) {

  return { elev: elev * Math.PI / 180, az: (h - 12.5) / 12 * Math.PI * 0.9 - 0.5 };
}
const warm = new THREE.Color(0xff7a3c), white = new THREE.Color(0xfff3e2), moon = new THREE.Color(0x9fb4ff);
const fogDay = new THREE.Color(0xb9cfe2), fogDusk = new THREE.Color(0xd9a27e), fogNight = new THREE.Color(0x0a1020);
let envTimer = null;
function setTime(h, final) {
  hour = h;
  const { elev, az } = sunAt(h), up = Math.sin(elev);
  sunDir.set(Math.cos(elev) * Math.sin(az), up, Math.cos(elev) * Math.cos(az)).normalize();
  const dark = elev < -0.02;
  if (dark) {
    sun.position.set(24, 60, -30); sun.color.copy(moon); sun.intensity = 0.32;
  } else {
    sun.position.copy(sunDir).multiplyScalar(80);
    sun.color.copy(warm).lerp(white, Math.min(1, Math.max(0, (elev - 0.03) / 0.45)));
    sun.intensity = 0.25 + 3.8 * Math.min(1, up * 1.6);
  }
  const daylight = Math.max(0, Math.min(1, (elev + 0.08) / 0.4));
  hemi.intensity = (sky ? 0.25 : 1.0) * (0.15 + 0.85 * daylight);
  if (sky) sky.material.uniforms.sunPosition.value.copy(sunDir).multiplyScalar(400);
  else scene.background = fogDay.clone().lerp(fogNight, 1 - daylight);
  stars.material.opacity = Math.max(0, Math.min(0.9, (-elev - 0.02) * 8));
  const fog = fogNight.clone().lerp(elev < 0.25 ? fogDusk : fogDay, daylight).lerp(fogDay, elev > 0.25 ? 1 : 0);
  scene.fog = new THREE.Fog(fog, 150, 480);
  lampLevel = Math.max(0, Math.min(1, (0.16 - elev) / 0.2));
  night = lampLevel > 0.5;
  M.glowWarm.emissiveIntensity = M.glowCool.emissiveIntensity = 0.3 + 7 * lampLevel;
  if (fancyWater) {
    fancyWater.material.uniforms.sunDirection.value.copy(dark ? new THREE.Vector3(0.3, 0.8, -0.4).normalize() : sunDir);
    fancyWater.material.uniforms.sunColor.value.copy(sun.color).multiplyScalar(dark ? 0.2 : 1);
  }
  placeNightLights();
  const slider = document.getElementById("time"), out = document.getElementById("timeOut");
  if (slider && +slider.value !== h) slider.value = h;
  if (out) out.textContent = String(Math.floor(h)).padStart(2, "0") + ":" + String(Math.round((h % 1) * 60)).padStart(2, "0");
  clearTimeout(envTimer);
  envTimer = setTimeout(refreshEnvironment, final ? 0 : 180);   // re-light from the sky, not on every tick of a drag
}
function setNight(on) { setTime(on ? 21.5 : 15.5, true); }
function refreshEnvironment() {
  if (!sky) return;
  scene.remove(sky); skyScene.add(sky);
  const next = pmrem.fromScene(skyScene, 0, 1, 1000);
  skyScene.remove(sky); scene.add(sky);
  if (envTarget) envTarget.dispose();

// the sky's light fills shadows; at full strength it flattens everything

  scene.traverse((o) => {
    const ms = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    ms.forEach((m) => { if (m.isMeshStandardMaterial) m.envMapIntensity = 0.45; });

// ---------------------------------------------------------------- graphics quality
// The scene renders into a half-float target; passes run on real brightness; the last
// pass tone-maps (ACES) and converts to sRGB, then FXAA smooths edges.
const FinalShader = {
  // the physical sky is bright by design (three's own sky example runs at half exposure)
  uniforms: { tDiffuse: { value: null }, exposure: { value: 0.55 }, vignette: { value: 0.28 } },
  vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: [
    "uniform sampler2D tDiffuse; uniform float exposure; uniform float vignette; varying vec2 vUv;",
    "vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }",
    "vec3 toSRGB(vec3 c) { return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }",
    "void main() {",
    "  vec3 c = aces(texture2D(tDiffuse, vUv).rgb * exposure * 0.8);",
    "  float v = smoothstep(0.85, 0.25, length(vUv - 0.5));",
    "  gl_FragColor = vec4(toSRGB(c * mix(1.0, v, vignette)), 1.0);",
    "}"].join("\n"),
};
const QUALITY = {
  low:   { label: "Low",   ratio: 1,   shadow: 1024, water: false, bloom: false, ao: false, fxaa: false, grass: 0 },
  high:  { label: "High",  ratio: 1.5, shadow: 2048, water: true,  bloom: true,  ao: false, fxaa: true,  grass: 0 },
  ultra: { label: "Ultra", ratio: 2,   shadow: 4096, water: true,  bloom: true,  ao: true,  fxaa: true,  grass: 30000 },
};
let quality = "high", composer = null, fxaaPass = null;
function applyQuality(q) {
  quality = q; const Q = QUALITY[q];

  sun.shadow.mapSize.set(Q.shadow, Q.shadow);

}

  }

// ---------------------------------------------------------------- stress tests
// Instanced trees and wind-blown grass: one draw call each, however many there are.
// These are for finding the ceiling; they are not part of the layout.
function onLand(r) {
  for (let tries = 0; tries < 30; tries++) {
    const x = (r() - 0.5) * (GROUND_SIZE - 4), z = (r() - 0.5) * (GROUND_SIZE - 4);
    if (groundY(x, z) > WATER_Y + 0.7) return [x, z];
  }
  return null;
}
function coloured(geo, hex) {
  const c = new THREE.Color(hex), n = geo.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  geo.setAttribute("color", new THREE.BufferAttribute(a, 3)); return geo;
}
let testTrees = null, testTreeCount = 0;
const TREE_CAP = 50000;
function addTrees(n) {

    const parts = [coloured(new THREE.CylinderGeometry(0.16, 0.24, 2.2, 6).translate(0, 1.1, 0), 0x5a3d26),
      coloured(new THREE.ConeGeometry(1.7, 2.8, 7).translate(0, 2.8, 0), 0x3d6a33),
      coloured(new THREE.ConeGeometry(1.25, 2.3, 7).translate(0, 3.9, 0), 0x46773a),
      coloured(new THREE.ConeGeometry(0.8, 1.8, 7).translate(0, 4.9, 0), 0x4f8240)];
    const geo = THREE.BufferGeometryUtils.mergeBufferGeometries(parts, false);
    testTrees = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9 }), TREE_CAP);
    testTrees.count = 0; testTrees.castShadow = true; testTrees.receiveShadow = true; testTrees.frustumCulled = false;
    scene.add(testTrees);
  }
  const r = rng(1000 + testTreeCount), m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < n && testTreeCount < TREE_CAP; i++) {
    const p = onLand(r); if (!p) continue;
    const s = 0.6 + r() * 0.8;
    m.compose(new THREE.Vector3(p[0], groundY(p[0], p[1]), p[1]), q.setFromAxisAngle(up, r() * 6.28), new THREE.Vector3(s, s, s));
    testTrees.setMatrixAt(testTreeCount++, m);
  }

}
function clearTrees() { if (testTrees) { testTrees.count = 0; testTreeCount = 0; } }
let grass = null, grassCount = 0;
const grassMat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 1 });

  shader.uniforms.uTime = { value: 0 };
  shader.vertexShader = "uniform float uTime;\n" + shader.vertexShader.replace("#include <begin_vertex>", [
    "#include <begin_vertex>",
    "#ifdef USE_INSTANCING",
    "  vec4 root = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);",
    "  float sway = sin(uTime * 1.8 + root.x * 0.35 + root.z * 0.23) + 0.5 * sin(uTime * 3.1 + root.z * 0.7);",
    "  transformed.x += sway * 0.09 * position.y * position.y * 4.0;",
    "  transformed.z += cos(uTime * 1.4 + root.x * 0.2) * 0.05 * position.y * 2.0;",
    "#endif"].join("\n"));

function tuftGeometry() {

    const a = k * Math.PI / 3, cx = Math.cos(a) * 0.07, cz = Math.sin(a) * 0.07, lean = (k - 1) * 0.08;
    pos.push(-cx, 0, -cz, cx, 0, cz, lean, 0.5, lean * 0.5);

  }

    const p = onLand(r); if (!p) continue;
    const s = 0.6 + r() * 0.9;
    m.compose(new THREE.Vector3(p[0], groundY(p[0], p[1]) - 0.02, p[1]), q.setFromAxisAngle(up, r() * 6.28), new THREE.Vector3(s, s * (0.8 + r() * 0.6), s));

// ---------------------------------------------------------------- selection and the overlay
let selected = null;   // {kind, id, wall?}
function select(sel) { selected = sel; drawOverlay(); showProps(); }
function sphere(x, y, z, r, mat, data) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), mat);
  m.position.set(x, y, z); m.renderOrder = 10; m.userData.handle = data; overlay.add(m); return m;
}
function drawOverlay() {
  while (overlay.children.length) { const c = overlay.children.pop(); if (c.geometry) c.geometry.dispose(); }
  const item = findThing(selected);
  if (item && selected.kind === "wall") {
    const w = item, top = (p) => groundY(p[0], p[1]) + w.height + 0.6;
    const pts = w.points.map((p) => new THREE.Vector3(p[0], top(p), p[1]));
    if (w.closed) pts.push(pts[0].clone());
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x2e6a9e, depthTest: false }));
    line.renderOrder = 9; overlay.add(line);
    w.points.forEach((p, i) => sphere(p[0], top(p), p[1], 0.38, M.handle, { type: "vertex", wall: w.id, index: i }));
    segmentsOf(w).forEach((seg) => {
      const mx = (seg.a[0] + seg.b[0]) / 2, mz = (seg.a[1] + seg.b[1]) / 2;
      sphere(mx, groundY(mx, mz) + w.height + 0.6, mz, 0.24, M.handleSoft, { type: "insert", wall: w.id, index: seg.i + 1 });
    });
  } else if (item && selected.kind === "opening") {
    const w = S.walls.find((x) => x.id === selected.wall), p = pointAt(w, item.s);
    sphere(p.x, groundY(p.x, p.z) + item.height + 0.4, p.z, 0.34, M.handle, { type: "opening", wall: w.id, id: item.id });
  } else if (item && selected.kind === "bridge") {
    [["a", item.a], ["b", item.b]].forEach(([end, p]) => sphere(p[0], groundY(p[0], p[1]) + item.lift + 1.4, p[1], 0.36, M.handle, { type: "end", id: item.id, end }));
  } else if (item) {
    const p = item.p, h = selected.kind === "light" ? 4.1 : selected.kind === "feature" && item.kind === "tower" ? 8.4 * item.scale : 2.2;
    sphere(p[0], groundY(p[0], p[1]) + h, p[1], 0.3, M.handle, { type: "move", kind: selected.kind, id: item.id });
  }

}

    const b = item, re = () => { rebuild("bridge", b.id); drawOverlay(); };
    head("Bridge", `${Math.hypot(b.b[0] - b.a[0], b.b[1] - b.a[1]).toFixed(1)} m span`);
    propsEl.append(field("Width", b.width, 1, 6, 0.1, "m", (v) => { b.width = v; re(); }),
      field("Deck lift", b.lift, 0, 3, 0.1, "m", (v) => { b.lift = v; re(); }),
      check("Railings", b.rails, (v) => { b.rails = v; re(); }));
    actions.append(button("Delete bridge", () => removeSelected(), "danger"));
    propsEl.append(actions);
  } else if (selected.kind === "light") {
    const l = item, re = () => { rebuild("light", l.id); drawOverlay(); };
    head("Lamp", night ? "Lit" : "Move the time past sunset to see it lit");
    propsEl.append(choice("Colour", l.color, { warm: "Warm", cool: "Cool" }, (v) => { l.color = v; re(); }),
      field("Brightness", l.power || 1, 0.2, 3, 0.1, "×", (v) => { l.power = v; placeNightLights(); }));
    actions.append(button("Delete lamp", () => removeSelected(), "danger"));
    propsEl.append(actions);
  } else {
    const f = item, re = () => { rebuild("feature", f.id); drawOverlay(); };
    head("Feature", { tower: "Tower", tree: "Tree", crate: "Crate" }[f.kind]);
    propsEl.append(field("Size", f.scale, 0.4, 2.5, 0.05, "×", (v) => { f.scale = v; re(); }),
      field("Turn", ((f.rot || 0) * 180 / Math.PI) % 360, 0, 360, 5, "°", (v) => { f.rot = v * Math.PI / 180; re(); }));
    actions.append(button("Delete", () => removeSelected(), "danger"));
    propsEl.append(actions);
  }
}
const statsEl = document.createElement("div"); statsEl.className = "stats";
function updateStats() {
  const doors = S.walls.reduce((t, w) => t + w.openings.length, 0), metres = S.walls.reduce((t, w) => t + wallLength(w), 0);
  statsEl.innerHTML = "";
  [["Walls", `${S.walls.length} · ${metres.toFixed(0)} m`], ["Doorways", doors], ["Bridges", S.bridges.length], ["Lamps", S.lights.length],
   ["Towers, trees, crates", S.features.length]].forEach(([k, v]) => { const a = document.createElement("span"); a.textContent = k; const b = document.createElement("span"); b.textContent = v; statsEl.append(a, b); });
}
function removeSelected() {
  if (!selected) return;
  remember();
  if (selected.kind === "opening") { const w = S.walls.find((x) => x.id === selected.wall); w.openings = w.openings.filter((o) => o.id !== selected.id); rebuild("wall", w.id); }
  else { const list = kindList(selected.kind); const i = list.findIndex((x) => x.id === selected.id); if (i >= 0) list.splice(i, 1); rebuild(selected.kind, selected.id); }
  select(null); updateStats(); save();
}

// ---------------------------------------------------------------- tools and pointer handling
let tool = "select";
const hints = {
  select: "<b>Select</b> · click a wall, doorway or anything else · drag handles to reshape · Delete removes",
  wall: "<b>Wall</b> · click to place corners · click the first corner to close · Enter or double-click to finish · Esc cancels",
  door: "<b>Doorway</b> · click on a wall to cut a doorway there",
  bridge: "<b>Bridge</b> · click where it starts, then where it ends",
  light: "<b>Lamp</b> · click to place · switch to night (N) to see them lit",
  tower: "<b>Tower</b> · click to place", tree: "<b>Tree</b> · click to place", crate: "<b>Crate</b> · click to place",
};
const hintEl = document.getElementById("hint");
function setTool(t) {
  tool = t; drawing = []; bridgeStart = null;
  document.querySelectorAll(".tool").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tool === t)));
  hintEl.innerHTML = hints[t]; ghost.visible = false; grid.visible = t !== "select" && t !== "door"; drawOverlay();
}
document.querySelectorAll(".tool").forEach((b) => b.addEventListener("click", () => setTool(b.dataset.tool)));

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function toMouse(e) { const r = renderer.domElement.getBoundingClientRect(); mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(mouse, camera); }
function snapV(v) { return document.getElementById("snap").checked ? Math.round(v * 2) / 2 : Math.round(v * 100) / 100; }
function groundPoint() { const hit = ray.intersectObject(ground, false)[0]; return hit ? [snapV(hit.point.x), snapV(hit.point.z)] : null; }
// Objects rebuilt since the last frame have stale world matrices until it is drawn, and a
// ray tests against those — so bring them up to date before any pick.
function fresh(group) { group.updateMatrixWorld(true); }
function pickWorld() {
  fresh(world);
  const hits = ray.intersectObjects(world.children, true);
  for (const h of hits) { let o = h.object; while (o && !o.userData.pick) o = o.parent; if (o) return { pick: o.userData.pick, point: h.point }; }
  return null;
}
function pickHandle() { fresh(overlay); const h = ray.intersectObjects(overlay.children, false).find((x) => x.object.userData.handle); return h ? Object.assign({ y: h.object.position.y }, h.object.userData.handle) : null; }
// Drags run on a level plane at the height of whatever was grabbed: the cursor always
// meets it (the ground can be missed past its edge), and the grabbed point stays under it.
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), planeHit = new THREE.Vector3();
function planePoint(y) { dragPlane.constant = -y; return ray.ray.intersectPlane(dragPlane, planeHit) ? [planeHit.x, planeHit.z] : null; }

// a ghost of what the tool would place, following the pointer
const ghost = new THREE.Group(); ghost.visible = false; scene.add(ghost);
function setGhost(kind) {
  ghost.clear();
  const item = kind === "light" ? { id: "g", p: [0, 0], color: "warm" } : { id: "g", kind, p: [0, 0], rot: 0, scale: 1 };
  const g = kind === "light" ? buildLamp(item) : buildFeature(item);
  g.position.set(0, 0, 0); g.traverse((o) => { if (o.isMesh) { o.material = M.ghost; o.castShadow = false; } });
  ghost.add(g); ghost.userData.kind = kind;
}

let drawing = [], bridgeStart = null, drag = null, downAt = null, lastClick = 0;
function drawWallPreview() {
  const pts = drawing.map((p) => new THREE.Vector3(p[0], groundY(p[0], p[1]) + 0.15, p[1]));
  if (hover) pts.push(new THREE.Vector3(hover[0], groundY(hover[0], hover[1]) + 0.15, hover[1]));
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x2e6a9e, depthTest: false }));
  line.renderOrder = 9; overlay.add(line);
  drawing.forEach((p, i) => sphere(p[0], groundY(p[0], p[1]) + 0.15, p[1], i === 0 ? 0.45 : 0.3, M.handle, null));
}
let hover = null;

renderer.domElement.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  toMouse(e); downAt = { x: e.clientX, y: e.clientY };
  if (tool !== "select") return;
  const h = pickHandle();
  if (h) {
    if (h.type === "vertex" && e.altKey) {
      const w = S.walls.find((x) => x.id === h.wall);
      if (w.points.length > 2) { remember(); w.points.splice(h.index, 1); fixOpenings(w); rebuild("wall", w.id); drawOverlay(); save(); }
      return;
    }
    const gp = planePoint(h.y);
    if (!gp) return;
    remember();
    if (h.type === "insert") {
      const w = S.walls.find((x) => x.id === h.wall), a = w.points[h.index - 1], b = w.points[h.index % w.points.length];
      const mid = [snapV((a[0] + b[0]) / 2), snapV((a[1] + b[1]) / 2)];
      w.points.splice(h.index, 0, mid);
      drag = { type: "vertex", wall: w.id, index: h.index, ref: mid };
    } else {
      drag = Object.assign({}, h, { ref: handleRef(h) });
    }
    // handles float above what they move, so the pointer meets the ground somewhere else:
    // keep that offset, or the corner would jump to the pointer on the first move
    drag.planeY = h.y;
    if (drag.ref) drag.offset = [drag.ref[0] - gp[0], drag.ref[1] - gp[1]];
    controls.enabled = false; e.preventDefault(); return;
  }
  const hit = pickWorld();
  if (hit && selected && samePick(hit.pick, selected)) {        // drag what is already selected
    remember();
    const y = hit.point.y;
    drag = hit.pick.kind === "opening" ? { type: "opening", wall: hit.pick.wall, id: hit.pick.id, planeY: y }
      : { type: "body", kind: hit.pick.kind, id: hit.pick.id, planeY: y, from: planePoint(y) };
    controls.enabled = false; e.preventDefault();
  }
});
function samePick(a, b) { return a && b && a.kind === b.kind && a.id === b.id; }
function handleRef(h) {
  if (h.type === "vertex") return S.walls.find((x) => x.id === h.wall).points[h.index].slice();
  if (h.type === "end") return S.bridges.find((x) => x.id === h.id)[h.end].slice();
  if (h.type === "move") return kindList(h.kind).find((x) => x.id === h.id).p.slice();
  return null;                   // a doorway follows the pointer along its wall
}

renderer.domElement.addEventListener("pointermove", (e) => {
  toMouse(e);
  if (drag) { const dp = planePoint(drag.planeY); if (dp) applyDrag(dp); return; }
  const gp = groundPoint();
  hover = gp;
  if (tool === "wall" && drawing.length) drawOverlay();
  if (["light", "tower", "tree", "crate"].includes(tool) && gp) {
    if (ghost.userData.kind !== tool) setGhost(tool);
    ghost.visible = true; ghost.position.set(gp[0], groundY(gp[0], gp[1]), gp[1]);
  } else ghost.visible = false;
  renderer.domElement.style.cursor = tool === "select" ? (pickHandle() ? "grab" : pickWorld() ? "pointer" : "default") : "crosshair";
});

window.addEventListener("pointerup", (e) => {
  if (drag) { drag = null; controls.enabled = true; save(); updateStats(); showProps(); return; }
  if (!downAt || e.button !== 0) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y); downAt = null;
  if (moved > 5 || e.target !== renderer.domElement) return;       // that was an orbit, not a click
  toMouse(e); click(e);
});

function click(e) {
  const gp = groundPoint(), now = performance.now(), double = now - lastClick < 320; lastClick = now;
  if (tool === "select") {
    const hit = pickWorld();
    select(hit ? hit.pick : null); return;
  }
  if (tool === "wall") {
    if (double && drawing.length >= 2) { finishWall(false); return; }
    if (!gp) return;
    if (drawing.length >= 3 && Math.hypot(gp[0] - drawing[0][0], gp[1] - drawing[0][1]) < 0.9) { finishWall(true); return; }
    const last = drawing[drawing.length - 1];
    if (!last || Math.hypot(gp[0] - last[0], gp[1] - last[1]) > 0.3) drawing.push(gp);
    drawOverlay(); return;
  }
  if (tool === "door") {
    const hit = pickWorld();
    if (!hit || (hit.pick.kind !== "wall" && hit.pick.kind !== "opening")) { flash("Click on a wall to put a doorway in it."); return; }
    const w = S.walls.find((x) => x.id === (hit.pick.wall || hit.pick.id));
    remember();
    const o = { id: nid("o"), s: nearestOnWall(w, hit.point.x, hit.point.z).s, width: 1.6, height: Math.min(2.4, w.height - 0.4), style: "door" };
    w.openings.push(o); rebuild("wall", w.id); save(); select({ kind: "opening", id: o.id, wall: w.id }); updateStats(); return;
  }
  if (!gp) return;
  if (tool === "bridge") {
    if (!bridgeStart) { bridgeStart = gp; flash("Now click where the bridge ends."); return; }
    remember();
    const b = { id: nid("b"), a: bridgeStart, b: gp, width: 2.4, lift: 0.3, rails: true };
    bridgeStart = null; S.bridges.push(b); rebuild("bridge", b.id); save(); select({ kind: "bridge", id: b.id }); updateStats(); return;
  }
  remember();
  if (tool === "light") { const l = { id: nid("l"), p: gp, color: "warm", power: 1 }; S.lights.push(l); rebuild("light", l.id); select({ kind: "light", id: l.id }); }
  else { const f = { id: nid("f"), kind: tool, p: gp, rot: Math.random() * 6.28, scale: tool === "tree" ? 0.8 + Math.random() * 0.5 : 1 }; S.features.push(f); rebuild("feature", f.id); select({ kind: "feature", id: f.id }); }
  save(); updateStats();
}

function finishWall(closed) {
  if (drawing.length < 2) return;
  remember();
  const w = { id: nid("w"), points: drawing.slice(), closed, height: 3, thickness: 0.5, posts: closed, battlements: false, openings: [] };
  S.walls.push(w); drawing = []; rebuild("wall", w.id); save(); updateStats();
  select({ kind: "wall", id: w.id });
}

function fixOpenings(w) { const L = wallLength(w); w.openings.forEach((o) => { o.s = Math.min(Math.max(o.s, 0), L); }); }

function applyDrag(gp) {
  if (drag.offset) gp = [snapV(gp[0] + drag.offset[0]), snapV(gp[1] + drag.offset[1])];
  if (drag.type === "vertex") {
    const w = S.walls.find((x) => x.id === drag.wall);
    w.points[drag.index] = gp; fixOpenings(w); rebuild("wall", w.id);
  } else if (drag.type === "opening") {
    const w = S.walls.find((x) => x.id === drag.wall), o = w.openings.find((x) => x.id === drag.id);
    o.s = nearestOnWall(w, gp[0], gp[1]).s; rebuild("wall", w.id);
  } else if (drag.type === "end") {
    const b = S.bridges.find((x) => x.id === drag.id); b[drag.end] = gp; rebuild("bridge", b.id);
  } else if (drag.type === "move") {
    const item = kindList(drag.kind).find((x) => x.id === drag.id); item.p = gp; rebuild(drag.kind, item.id);
  } else if (drag.type === "body") {
    if (!drag.from) { drag.from = gp; return; }
    const dx = gp[0] - drag.from[0], dz = gp[1] - drag.from[1];
    if (!dx && !dz) return;
    drag.from = gp;
    const item = kindList(drag.kind).find((x) => x.id === drag.id);
    if (drag.kind === "wall") item.points = item.points.map((p) => [p[0] + dx, p[1] + dz]);
    else if (drag.kind === "bridge") { item.a = [item.a[0] + dx, item.a[1] + dz]; item.b = [item.b[0] + dx, item.b[1] + dz]; }
    else item.p = [item.p[0] + dx, item.p[1] + dz];
    rebuild(drag.kind, item.id);
  }
  drawOverlay();
}

let flashTimer = null;
function flash(text) { hintEl.textContent = text; clearTimeout(flashTimer); flashTimer = setTimeout(() => { hintEl.innerHTML = hints[tool]; }, 2200); }

window.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input, textarea, select, dialog")) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === "y") { e.preventDefault(); redo(); return; }
  if (k === "escape") { if (drawing.length) { drawing = []; drawOverlay(); } else { bridgeStart = null; select(null); } return; }
  if (k === "enter" && tool === "wall") { finishWall(false); return; }
  if (k === "delete" || k === "backspace") { removeSelected(); return; }
  if (k === "r" && selected && selected.kind === "feature") { remember(); const f = findThing(selected); f.rot = (f.rot || 0) + Math.PI / 12; rebuild("feature", f.id); save(); showProps(); return; }
  const map = { v: "select", w: "wall", d: "door", b: "bridge", l: "light", t: "tower", e: "tree", c: "crate" };
  if (map[k]) setTool(map[k]);
  if (k === "n") setNight(!night);
});
document.getElementById("undo").addEventListener("click", undo);
document.getElementById("redo").addEventListener("click", redo);

// ---------------------------------------------------------------- layout in and out
const dlg = document.getElementById("layoutDialog"), txt = document.getElementById("layoutText"), msg = document.getElementById("layoutMsg");
document.getElementById("layout").addEventListener("click", () => { txt.value = JSON.stringify(S, null, 1); msg.textContent = ""; dlg.showModal(); });
document.getElementById("closeLayout").addEventListener("click", () => dlg.close());
document.getElementById("copyLayout").addEventListener("click", () => {
  navigator.clipboard.writeText(txt.value).then(() => { msg.textContent = "Copied."; }, () => { txt.select(); msg.textContent = "Copying is blocked here; the text is selected, so press Ctrl+C."; });
});
document.getElementById("loadLayout").addEventListener("click", () => {
  try {
    const s = JSON.parse(txt.value);
    if (!s || !Array.isArray(s.walls)) throw new Error("it has no walls list");
    ["bridges", "lights", "features"].forEach((k) => { if (!Array.isArray(s[k])) s[k] = []; });
    s.walls.forEach((w) => { w.openings = w.openings || []; });
    remember(); S = s; select(null); rebuildAll(); save(); msg.textContent = "Loaded."; dlg.close();
  } catch (err) { msg.textContent = "That is not a layout: " + err.message; }
});
document.getElementById("resetLayout").addEventListener("click", () => { remember(); S = clone(SAMPLE); select(null); rebuildAll(); save(); dlg.close(); });

// ---------------------------------------------------------------- go
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (composer) {
    composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h);
    if (fxaaPass) fxaaPass.material.uniforms.resolution.value.set(1 / (w * renderer.getPixelRatio()), 1 / (h * renderer.getPixelRatio()));
  }
}
window.addEventListener("resize", resize);
document.getElementById("time").addEventListener("input", (e) => setTime(+e.target.value, false));
document.getElementById("time").addEventListener("change", (e) => setTime(+e.target.value, true));
document.getElementById("quality").addEventListener("change", (e) => { applyQuality(e.target.value); if (!selected) showProps(); });
resize(); applyQuality("high"); setTime(15.5, true); rebuildAll(); setTool("select"); showProps();

// frames per second, draw calls and triangles, measured over every pass of a frame
const clock = new THREE.Clock();
let frames = 0, elapsed = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  controls.update();
  if (water === fancyWater) fancyWater.material.uniforms.time.value += dt * 0.5;
  if (grassMat.userData.shader) grassMat.userData.shader.uniforms.uTime.value += dt;
  renderer.info.reset();
  if (composer) composer.render(dt); else renderer.render(scene, camera);
  frames++; elapsed += dt;
  if (elapsed > 0.5) {
    const tris = renderer.info.render.triangles;
    statusEl.textContent = `${Math.round(frames / elapsed)} fps · ${renderer.info.render.calls} draws · ${tris > 1e6 ? (tris / 1e6).toFixed(2) + "M" : Math.round(tris / 1000) + "k"} tris`;
    frames = 0; elapsed = 0;
  }
});

// a small handle for automated checks of the page
window.rampart = {
  state: () => S, select, setTool, setNight, setTime, applyQuality, addTrees, setGrass, rebuildAll, undo,
  screen(x, z, up) {             // where a point on the ground (plus a height) is on screen
    const v = new THREE.Vector3(x, groundY(x, z) + (up || 0), z).project(camera), r = renderer.domElement.getBoundingClientRect();
    return [r.left + (v.x + 1) / 2 * r.width, r.top + (1 - v.y) / 2 * r.height];
  },
  probe(px, py) {                // what is under a point on screen, as the editor sees it
    toMouse({ clientX: px, clientY: py });
    const w = pickWorld();
    const r = renderer.domElement.getBoundingClientRect();
    const handles = overlay.children.filter((o) => o.userData.handle).map((o) => {
      const v = o.position.clone().project(camera);
      return [o.userData.handle.type, Math.round(r.left + (v.x + 1) / 2 * r.width), Math.round(r.top + (1 - v.y) / 2 * r.height)];
    });
    return { handle: pickHandle(), pick: w && w.pick, ground: groundPoint(), dragging: !!drag, drag, tool, handles,
             canvas: [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)] };
  },
};
})();
</script>
