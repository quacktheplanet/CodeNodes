<title>Sanctum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* One deliberate look: a film frame. The controls are smoked glass and every colour is set
   here, whatever the viewer's theme. */
:root {
  --glass: rgba(12, 12, 10, 0.55); --edge: rgba(255, 236, 200, 0.14);
  --ink: #F4EFE4; --muted: #B9B1A2; --amber: #F0C27A; --amber-ink: #1D1406;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: #050504; color: var(--ink); font-family: var(--body); overflow: hidden; font-size: 14px; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.15); border: 1px solid var(--edge); border-radius: 12px; }
#panel { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 32px));
  padding: 14px 16px; display: grid; gap: 12px; max-height: calc(100% - 32px); overflow: auto; }
#panel h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 30px; letter-spacing: 0.14em; line-height: 1; }
#panel .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.field { display: grid; gap: 4px; }
.field .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.field label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.field output { font-family: var(--mono); font-size: 12px; color: var(--amber); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--amber); margin: 0; }
.buttons { display: flex; gap: 6px; flex-wrap: wrap; }
button, select { font: inherit; color: var(--ink); }
.btn { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--edge); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-weight: 500; }
.btn:hover { background: rgba(255, 255, 255, 0.12); }
.btn[aria-pressed="true"] { background: var(--amber); color: var(--amber-ink); border-color: transparent; }
select { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--edge); border-radius: 8px; padding: 5px 8px; }
select option { background: #16140f; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#hud { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px; padding: 6px 10px; font-family: var(--mono);
  font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bars { position: fixed; left: 0; right: 0; height: 5.5vh; background: #000; pointer-events: none; transition: opacity 0.6s; }
.bars.top { top: 0; } .bars.bottom { bottom: 0; }
body.free .bars { opacity: 0; }
@media (max-width: 640px) {
  #panel { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 10px; width: calc(100% - 20px); max-height: 50%; padding: 12px; gap: 10px; }
  #panel h1 { font-size: 24px; }
  #panel .sub { display: none; }
}
</style>

<div id="stage" aria-label="A ruined temple in a misty forest at dawn, in a slow flythrough."></div>
<div class="bars top" aria-hidden="true"></div><div class="bars bottom" aria-hidden="true"></div>
<div id="hud" class="glass" role="status">Building the scene…</div>
<section id="panel" class="glass" aria-label="Film">
  <div>
    <h1>Sanctum</h1>
    <p class="sub">A ruin at dawn, built from code and drawn the way games draw: millions of triangles, light through the mist, a camera on rails. Stop the camera to look around.</p>
  </div>
  <div class="field"><div class="row"><label for="sun">Sun height</label><output id="sunOut" for="sun"></output></div>
    <input type="range" id="sun" min="-1" max="30" step="0.1" value="7"></div>
  <div class="field"><div class="row"><label for="mist">Mist</label><output id="mistOut" for="mist"></output></div>
    <input type="range" id="mist" min="0" max="1" step="0.01" value="0.55"></div>
  <div class="field"><div class="row"><label for="quality">Quality</label></div>
    <select id="quality"><option value="low">Low</option><option value="high" selected>High</option><option value="ultra">Ultra</option></select></div>
  <div class="buttons">
    <button class="btn" id="camera" type="button" aria-pressed="true">Camera on rails</button>
    <button class="btn" id="film" type="button" aria-pressed="true">Film look</button>
  </div>
</section>

const grassMat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 1 });
grassMat.onBeforeCompile = (sh) => {
  sh.uniforms.uTime = { value: 0 }; grassMat.userData.shader = sh;
  sh.vertexShader = "uniform float uTime;\n" + sh.vertexShader.replace("#include <begin_vertex>", `#include <begin_vertex>
  #ifdef USE_INSTANCING
    vec4 root = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
    float sway = sin(uTime * 1.6 + root.x * 0.25 + root.z * 0.19) + 0.4 * sin(uTime * 2.9 + root.z * 0.6);
    transformed.x += sway * 0.12 * position.y * position.y;
    transformed.z += cos(uTime * 1.2 + root.x * 0.2) * 0.06 * position.y;
  #endif`);
};
function blade() {
  const pos = [], col = [], base = new THREE.Color(0x26351a), tip = new THREE.Color(0x8fa65a);
  for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3, cx = Math.cos(a) * 0.06, cz = Math.sin(a) * 0.06, l = (k - 1) * 0.12;
    pos.push(-cx, 0, -cz, cx, 0, cz, l, 0.75, l * 0.4); col.push(base.r, base.g, base.b, base.r, base.g, base.b, tip.r, tip.g, tip.b); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals(); return g;
}
function inTemple(x, z) { return Math.abs(x) < W / 2 + 4 && Math.abs(z) < D / 2 + 4; }
function plant(treeCount, rockCount, grassCount) {
  [forest, rocks, grass].forEach((m) => { if (m) { scene.remove(m); m.geometry.dispose(); } });
  const r = rng(11), mm = new THREE.Matrix4(), qq = new THREE.Quaternion();
  forest = new THREE.InstancedMesh(tree(), treeMat, treeCount); let n = 0;
  for (let i = 0; i < treeCount * 3 && n < treeCount; i++) {
    const x = (r() - 0.5) * SIZE * 0.9, z = (r() - 0.5) * SIZE * 0.9, d = Math.hypot(x, z);
    if (d < 34 + r() * 14 || (typeof nearPath === "function" && nearPath(x, z, 11))) continue;   // the clearing, and the camera's way
    const s = 0.7 + r() * 0.8;
    mm.compose(new THREE.Vector3(x, groundY(x, z) - 0.3, z), qq.setFromAxisAngle(up, r() * 6.28), new THREE.Vector3(s, s * (0.85 + r() * 0.4), s));
    forest.setMatrixAt(n++, mm);
  }
  forest.count = n; forest.castShadow = forest.receiveShadow = true; scene.add(forest);
  rocks = new THREE.InstancedMesh(rock(), rockMat, rockCount); n = 0;
  for (let i = 0; i < rockCount; i++) {
    const x = (r() - 0.5) * SIZE * 0.8, z = (r() - 0.5) * SIZE * 0.8; if (inTemple(x, z) || nearPath(x, z, 3.5)) continue;
    const s = 0.3 + Math.pow(r(), 3) * 2.5;
    mm.compose(new THREE.Vector3(x, groundY(x, z) + s * 0.1, z), qq.setFromEuler(new THREE.Euler(r(), r() * 6, r())), new THREE.Vector3(s, s, s));
    rocks.setMatrixAt(n++, mm);
  }
  rocks.count = n; rocks.castShadow = rocks.receiveShadow = true; scene.add(rocks);
  grass = new THREE.InstancedMesh(blade(), grassMat, grassCount); n = 0;
  for (let i = 0; i < grassCount; i++) {
    const a = r() * Math.PI * 2, d = Math.sqrt(r()) * 90, x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (inTemple(x, z) && Math.hypot(x, z) < 26 && r() < 0.95) continue;
    const s = 0.6 + r() * 0.9;
    mm.compose(new THREE.Vector3(x, groundY(x, z) - 0.05, z), qq.setFromAxisAngle(up, r() * 6.28), new THREE.Vector3(s, s * (0.7 + r() * 0.8), s));
    grass.setMatrixAt(n++, mm);
  }
  grass.count = n; grass.receiveShadow = true; grass.frustumCulled = false; scene.add(grass);
}

// ------------------------------------------------------------------ the light: sun, mist, shafts
function setSun(deg) {
  const e = THREE.MathUtils.degToRad(deg), az = THREE.MathUtils.degToRad(200);
  sunDir.set(Math.cos(e) * Math.sin(az), Math.sin(e), Math.cos(e) * Math.cos(az)).normalize();
  sky.material.uniforms.sunPosition.value.copy(sunDir).multiplyScalar(400);
  sun.position.copy(sunDir).multiplyScalar(160); sun.target.position.set(0, 0, 0);
  const k = THREE.MathUtils.clamp(deg / 20, 0, 1);
  sun.color.setRGB(1, 0.62 + 0.3 * k, 0.36 + 0.5 * k);
  sun.intensity = deg < 0 ? 0.1 : 1.2 + 5 * THREE.MathUtils.clamp(deg / 12, 0, 1);
  hemi.intensity = 0.15 + 0.4 * THREE.MathUtils.clamp((deg + 2) / 15, 0, 1);
  scene.remove(sky); skyScene.add(sky);
  const next = pmrem.fromScene(skyScene, 0, 1, 1000);
  skyScene.remove(sky); scene.add(sky);
  if (envTarget) envTarget.dispose(); envTarget = next; scene.environment = envTarget.texture;
  scene.traverse((o) => { if (o.material && o.material.isMeshStandardMaterial) o.material.envMapIntensity = 0.5; });
  setMist(mist);
}
let mist = 0.55;
function setMist(v) {
  mist = v;
  const c = new THREE.Color().setRGB(0.62, 0.6, 0.58).lerp(sun.color, 0.35).multiplyScalar(0.55 + 0.4 * THREE.MathUtils.clamp(sunDir.y * 4, 0, 1));
  scene.fog = new THREE.FogExp2(c, 0.0005 + v * 0.011);
  if (shaftPass) shaftPass.uniforms.uStrength.value = 0.35 + v * 0.9;
}

// ------------------------------------------------------------------ post: shafts, depth of field, bloom, film
// Light shafts: march from each pixel towards the sun on screen, gathering the bright sky
// the temple and trees do not hide.
const ShaftShader = {
  uniforms: { tDiffuse: { value: null }, uSun: { value: new THREE.Vector2(0.5, 0.5) }, uStrength: { value: 0.8 }, uVisible: { value: 1 } },
  vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 uSun; uniform float uStrength, uVisible; varying vec2 vUv;
    void main() {
      vec3 base = texture2D(tDiffuse, vUv).rgb;
      vec2 d = (uSun - vUv) / 64.0; vec2 p = vUv; float decay = 1.0; vec3 acc = vec3(0.0);
      for (int i = 0; i < 64; i++) { p += d; vec3 s = texture2D(tDiffuse, clamp(p, 0.0, 1.0)).rgb; float l = max(dot(s, vec3(0.3, 0.5, 0.2)) - 1.2, 0.0); acc += s * l * decay; decay *= 0.965; }
      gl_FragColor = vec4(base + acc * 0.02 * uStrength * uVisible, 1.0);
    }`,
};
const FilmShader = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uFilm: { value: 1 } },
  vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uFilm; varying vec2 vUv;
    vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
    float h(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec2 uv = vUv;
      vec3 c;
      if (uFilm > 0.5) {                               // a touch of lens fringing at the edges
        vec2 o = (uv - 0.5) * 0.0022;
        c = vec3(texture2D(tDiffuse, uv + o).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv - o).b);
      } else c = texture2D(tDiffuse, uv).rgb;
      c = aces(c * 0.62);
      if (uFilm > 0.5) {
        float l = dot(c, vec3(0.299, 0.587, 0.114));
        c = mix(c, c * vec3(0.9, 1.0, 1.08), (1.0 - l) * 0.35) * mix(vec3(1.0), vec3(1.06, 1.0, 0.9), l);   // cool shadows, warm light
        c *= 1.0 - 0.55 * pow(length(uv - 0.5) * 1.25, 2.4);
        c += (h(uv * 1000.0 + uTime) - 0.5) * 0.018;
      }
      gl_FragColor = vec4(pow(max(c, 0.0), vec3(1.0 / 2.2)), 1.0);
    }`,
};
const QUALITY = {
  low: { ratio: 1, shadow: 2048, trees: 1500, rocks: 1200, grass: 60000, samples: 0, dof: false, bloom: true },
  high: { ratio: 1.5, shadow: 4096, trees: 3500, rocks: 3000, grass: 220000, samples: 4, dof: false, bloom: true },
  ultra: { ratio: 2, shadow: 4096, trees: 6000, rocks: 6000, grass: 500000, samples: 4, dof: true, bloom: true },
};
let composer = null, shaftPass = null, filmPass = null, bokehPass = null, quality = "high";
function build(q) {
  quality = q; const Q = QUALITY[q];
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q.ratio));
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  sun.shadow.mapSize.set(Q.shadow, Q.shadow);
  plant(Q.trees, Q.rocks, Q.grass);
  const w = stage.clientWidth, h = stage.clientHeight, pr = renderer.getPixelRatio();
  const target = new THREE.WebGLRenderTarget(w * pr, h * pr, { type: THREE.HalfFloatType, samples: Q.samples });
  composer = new THREE.EffectComposer(renderer, target);
  composer.addPass(new THREE.RenderPass(scene, camera));
  shaftPass = new THREE.ShaderPass(ShaftShader); composer.addPass(shaftPass);
  bokehPass = null;
  if (Q.dof && THREE.BokehPass) { bokehPass = new THREE.BokehPass(scene, camera, { focus: 30, aperture: 0.00012, maxblur: 0.006, width: w, height: h }); composer.addPass(bokehPass); }
  if (Q.bloom) composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(w, h), 0.45, 0.6, 2.4));
  filmPass = new THREE.ShaderPass(FilmShader); composer.addPass(filmPass);
  filmPass.uniforms.uFilm.value = filmOn ? 1 : 0;
  setMist(mist); resize();
}

// ------------------------------------------------------------------ the camera: a slow path
// The flight threads the real gaps: in through the middle of the front row (columns stand
// 3.4 m apart), past the shrine door, along the side aisle, and out through the back row.
const path = new THREE.CatmullRomCurve3([
  [-120, 40, 150], [-70, 26, 100], [-30, 12, 55], [-8, 6.5, 26], [0, 5, 15.5], [0, 4.6, 10.2], [0, 4.2, 6.6], [7, 4.6, 6.2],
  [12.5, 5, 1], [13.6, 5.4, -6], [13.6, 6, -10.2], [16, 10, -22], [32, 24, -18], [22, 32, 32], [-50, 36, 92],
].map((v) => new THREE.Vector3(...v)), true, "centripetal", 0.5);
const look = new THREE.CatmullRomCurve3([
  [0, 8, 0], [0, 7, 0], [0, 6, 0], [0, 5, 4], [0, 4, 4], [0, 3.4, 0], [0, 2.6, -1], [5, 3, -1],
  [13, 5, -6], [13.6, 5.5, -14], [14, 6, -20], [10, 6, -10], [0, 6, 0], [0, 6, 0], [0, 7, 0],
].map((v) => new THREE.Vector3(...v)), true, "centripetal", 0.5);
const corridor = path.getSpacedPoints(400);
function nearPath(x, z, r) { return corridor.some((p) => (p.x - x) * (p.x - x) + (p.z - z) * (p.z - z) < r * r); }let onRails = true, filmOn = true, t0 = performance.now(), railT = 0;

// ------------------------------------------------------------------ the loop
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); }
}
window.addEventListener("resize", resize);
const clock = new THREE.Clock(); let frames = 0, acc = 0;
const sunScreen = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (onRails) {
    railT = (railT + dt / 70) % 1;                                        // seventy seconds a lap
    camera.position.copy(path.getPointAt(railT)); camera.position.y = Math.max(camera.position.y, groundY(camera.position.x, camera.position.z) + 1.6);
    camera.lookAt(look.getPointAt(railT));
  } else controls.update();
  if (grassMat.userData.shader) grassMat.userData.shader.uniforms.uTime.value += dt;
  sunScreen.copy(sunDir).multiplyScalar(400).add(camera.position).project(camera);
  shaftPass.uniforms.uSun.value.set(sunScreen.x * 0.5 + 0.5, sunScreen.y * 0.5 + 0.5);
  shaftPass.uniforms.uVisible.value = sunScreen.z < 1 ? THREE.MathUtils.clamp(1.4 - Math.hypot(sunScreen.x, sunScreen.y) * 0.6, 0, 1) : 0;
  if (bokehPass) bokehPass.uniforms.focus.value = camera.position.distanceTo(new THREE.Vector3(0, 4, 0));
  filmPass.uniforms.uTime.value += dt;
  renderer.info.reset(); composer.render(dt);
  frames++; acc += dt;
  if (acc > 0.5) { const tri = renderer.info.render.triangles;
    hud.textContent = `${Math.round(frames / acc)} fps · ${renderer.info.render.calls} draws · ${(tri / 1e6).toFixed(2)}M triangles`; frames = 0; acc = 0; }
});

// ------------------------------------------------------------------ controls
const bindRange = (id, fmt, set) => { const el = document.getElementById(id), out = document.getElementById(id + "Out"); const u = () => { set(+el.value); out.textContent = fmt(+el.value); }; el.addEventListener("input", u); el.addEventListener("change", u); out.textContent = fmt(+el.value); };
bindRange("sun", (v) => v.toFixed(1) + "°", (v) => setSun(v));
bindRange("mist", (v) => Math.round(v * 100) + "%", (v) => setMist(v));
document.getElementById("quality").addEventListener("change", (e) => build(e.target.value));
const camBtn = document.getElementById("camera");
camBtn.addEventListener("click", () => {
  onRails = !onRails; camBtn.setAttribute("aria-pressed", String(onRails)); camBtn.textContent = onRails ? "Camera on rails" : "Free camera";
  controls.enabled = !onRails; document.body.classList.toggle("free", !onRails);
  if (!onRails) { controls.target.set(0, 4, 0); controls.update(); }
});
const filmBtn = document.getElementById("film");
filmBtn.addEventListener("click", () => { filmOn = !filmOn; filmBtn.setAttribute("aria-pressed", String(filmOn)); filmPass.uniforms.uFilm.value = filmOn ? 1 : 0; });

setSun(7); build("high");
window.sanctum = { at(t) { railT = t; }, setSun, setMist, build, camera, stop() { onRails = false; } };
})();
</script>
